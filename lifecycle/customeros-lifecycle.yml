source: https://status.customeros.ai/, https://customeros.ai/updates, https://github.com/customeros/customeros
description: >-
  Lifecycle posture for CustomerOS. A live status page and a dated product-updates feed exist. What
  does not exist is anything an API consumer can plan against: no versioning policy, no deprecation
  policy, no Sunset/Deprecation header support, and no published SLA. The most consequential
  lifecycle event in the company's history — the Openline-to-CustomerOS rename, the deletion of the
  openline-ai GitHub organization, and the removal of the API reference pages from the docs — was
  never announced on any of these surfaces.
