event_vocabulary:
  source: grpc/
  note: >-
    proto3 message schemas published in the monorepo describe an internal event stream, not a
    customer-facing one. They are the only machine-readable description of the tracking data model.
  messages:
  - CompanyCreated
  - TenantCreated
  - WebTrackerCreated
  - WebTrackerSessionCreated
  - WebTrackerSessionClosed
  - WebTrackerEvent
  - WebTrackerVisitorIdentified
  - ProxyWebTrackerCnameConfigured
  - WebsiteCrawled
  - WebpageScraped
  - WebpageClassified
  - WebpageProfiled
  - IcpFitDetermined
  - RequestIcpFitAnalysis
  - RequestIdentifyIpaddress
  - RequestVerifyIpaddress
  - RequestWebpageClassification
  - RequestWebpageIntent
documented_but_unmodelled:
  note: >-
    Concepts the documentation presents as the core of the product that have NO representation in any
    published contract.
  entities: [Lead, Touchpoint, Brief, ICP definition, Buying stage, Workspace, Insight]
  source: https://docs.customeros.ai/data-structure
