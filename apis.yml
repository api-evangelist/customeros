aid: customeros
url: https://raw.githubusercontent.com/api-evangelist/customeros/refs/heads/main/apis.yml
name: CustomerOS
kind: company
description: CustomerOS (formerly Openline) is a London-based revenue-intelligence platform
  for B2B go-to-market teams. It identifies anonymous website visitors, scores them against
  an ideal customer profile, infers buying stage from page engagement, and attributes content
  and ad spend to real pipeline. The developer surface spans a first-party JavaScript website
  tracker installed behind a customer-owned reverse-proxy CNAME, a set of key-authenticated
  REST APIs published as OpenAPI in the company monorepo (CustomerBASE contacts and
  organizations, person and organization enrichment, email verification and IP intelligence,
  Mailstack sending domains and mailboxes, billing invoices, outreach tracking), a 34-operation
  Flow API for outbound sequencing, and the open-source customer-os-api GraphQL server that
  predates the pivot. CustomerOS also runs a live anonymous MCP server and serves an A2A agent
  card from its documentation host.
