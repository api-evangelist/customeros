apis:
- aid: customeros:customeros-customerbase-rest-api
  name: CustomerOS Customerbase REST API
  tags:
  - REST
  - Customerbase
  - Organizations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.customeros.ai/api-overview
  baseURL: https://api.customeros.ai/customerbase/v1
  properties:
  - url: https://docs.customeros.ai/api-overview
    type: Documentation
  - url: https://docs.customeros.ai/api-descriptions
    type: APIReference
  description: >-
    Documented synchronous REST API on the customeros.ai cloud (api.customeros.ai/customerbase/v1), authenticated
    with the X-CUSTOMER-OS-API-KEY header. Includes organization endpoints such as POST /organizations.
    Access to each endpoint group is granted on a per-request basis by the CustomerOS team.
- aid: customeros:customeros-website-tracker
  name: CustomerOS Website Tracker
  tags:
  - Tracking
  - Visitor Identification
  - JavaScript
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.customeros.ai/website-tracker
  baseURL: https://docs.customeros.ai/tracker
  properties:
  - url: https://docs.customeros.ai/website-tracker
    type: Documentation
  - url: https://docs.customeros.ai/tracker/custom-events
    type: Documentation
  description: >-
    Client-side JavaScript tracker, installed via a script tag behind a customer-hosted reverse-proxy
    CNAME, that captures page views and custom events and matches visitor IPs to companies. It is a script
    integration rather than a public REST/GraphQL endpoint; custom events are emitted from the browser.
