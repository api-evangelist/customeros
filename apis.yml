apis:
- aid: customeros:customeros-website-tracker
  name: CustomerOS Website Tracker
  tags:
  - Tracking
  - Visitor Identification
  - JavaScript
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.customeros.ai/website-tracker
  baseURL: https://{customer-reverse-proxy-domain}/analytics-0.1.js
  properties:
  - url: https://docs.customeros.ai/website-tracker
    type: Documentation
  - url: https://docs.customeros.ai/tracker/custom-events
    type: Documentation
    name: Custom events (Alpha)
  - url: components/customeros-components.yml
    type: Components
  description: >-
    Client-side JavaScript tracker that captures page views and custom events, exposes window.cos.identify()
    for attaching identity and properties, and matches visitor IPs to companies. Since the 2025-09-08
    change CustomerOS supports it ONLY when served from a reverse proxy on the customer's own domain,
    so the base URL is templated by design — there is no CustomerOS-hosted CDN URL to record and no version-pinned
    build.
- aid: customeros:customeros-graphql-api
  name: CustomerOS GraphQL API
  description: >-
    Single GraphQL endpoint served by the open-source customer-os-api (Go, gqlgen) covering organizations,
    contacts, opportunities, contracts, invoices, interactions and timeline events. The repository moved
    with the rename: github.com/openline-ai/openline-customer-os now 301s to github.com/customeros/customeros,
    where 69 .graphqls schema files are published. Introspection could not be run — the published endpoint
    host does not resolve.
  humanURL: https://github.com/customeros/customeros
  baseURL: https://api.customeros.ai/query
  tags:
  - GraphQL
  properties:
  - type: OpenAPI
    url: openapi/customeros-graphql-api-openapi.yml
    name: HTTP envelope for POST /query
