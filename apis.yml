    name: Billing invoices
  - url: openapi/customeros-outreach-openapi.yml
    type: OpenAPI
    name: Outreach email tracking
  - url: openapi/_original/customeros-swagger.json
    type: Swagger
    name: Source Swagger 2.0 (verbatim)
  - url: https://github.com/customeros/customeros
    type: SourceCode
  - url: https://docs.customeros.ai
    type: Documentation
  description: >-
    Key-authenticated REST surface for the customeros.ai cloud, published as six OpenAPI 3.0.1
    documents (one per tag) plus the source Swagger 2.0 in github.com/customeros/customeros. All
    six declare the same ApiKeyAuth scheme, an X-CUSTOMER-OS-API-KEY header, and the same
    servers[] host https://api.customeros.ai. Access to each endpoint group is granted on a
    per-request basis by the CustomerOS team. NOTE: as of 2026-08-13 api.customeros.ai has no DNS
    address record, and the docs pages that used to document this API (docs.customeros.ai/api-overview
    and /api-descriptions) now return 404 — see lifecycle/customeros-lifecycle.yml.
- aid: customeros:customeros-flow-api
  name: CustomerOS Flow API
  tags:
  - REST
  - Outbound
  - Sequences
  - Email
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.customeros.ai
  baseURL: https://api.customeros.ai/flow/{version}
  properties:
  - url: openapi/customeros-flow-api-openapi.yml
    type: OpenAPI
    name: Flow API
  - url: openapi/_original/customeros-flow-openapi.json
    type: OpenAPI
    name: Flow API (verbatim, as served)
  - url: https://docs.customeros.ai
    type: Documentation
  description: >-
    34-operation REST API for outbound sequencing — flows, sequences, steps (email, LinkedIn or
    manual), senders with warming state and daily send limits, sending schedules, opt-out and
    analytics config, and per-sequence contacts. Server is templated as
    https://api.customeros.ai/flow/{version} with version defaulting to v1. The spec is advertised
    in the docs llms.txt as flowApiSpec.yaml but every HTTP path for it 404s; it was harvested from
    the documentation MCP server's virtual filesystem, which is the only surface that serves it.
- aid: customeros:customeros-website-tracker
  name: CustomerOS Website Tracker
  tags:
  - Tracking
  - Visitor Identification
  - JavaScript
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.customeros.ai/website-tracker
  baseURL: https://{customer-reverse-proxy-domain}/analytics-0.1.js
  properties:
  - url: https://docs.customeros.ai/website-tracker
    type: Documentation
  - url: https://docs.customeros.ai/tracker/custom-events
    type: Documentation
    name: Custom events (Alpha)
  - url: components/customeros-components.yml
    type: Components
  description: >-
    Client-side JavaScript tracker that captures page views and custom events, exposes
    window.cos.identify() for attaching identity and properties, and matches visitor IPs to
    companies. Since the 2025-09-08 change CustomerOS supports it ONLY when served from a
    reverse proxy on the customer's own domain, so the base URL is templated by design — there
    is no CustomerOS-hosted CDN URL to record and no version-pinned build.
- aid: customeros:customeros-graphql-api
  name: CustomerOS GraphQL API
  description: >-
    Single GraphQL endpoint served by the open-source customer-os-api (Go, gqlgen) covering
    organizations, contacts, opportunities, contracts, invoices, interactions and timeline
    events. The repository moved with the rename: github.com/openline-ai/openline-customer-os
    now 301s to github.com/customeros/customeros, where 69 .graphqls schema files are published.
    Introspection could not be run — the published endpoint host does not resolve.
  humanURL: https://github.com/customeros/customeros
  baseURL: https://api.customeros.ai/query
  tags:
  - GraphQL
  properties:
  - type: OpenAPI
    url: openapi/customeros-graphql-api-openapi.yml
    name: HTTP envelope for POST /query
  - type: GraphQL
    url: graphql/customeros-graphql.md
  - type: GraphQL
    url: graphql/customeros-schema.graphql
    name: Representative schema
  - type: SourceCode
    url: https://github.com/customeros/customeros
  - type: Documentation
    url: https://docs.customeros.ai/data-structure
  - type: Documentation
    url: https://docs.customeros.ai/contacts
