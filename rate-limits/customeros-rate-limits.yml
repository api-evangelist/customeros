description: >-
  CustomerOS publishes no API rate limits. This is a measured zero rather than an assumed one: the
  entire documentation corpus was grep-searched for "rate limit" through the provider's own docs MCP
  filesystem and the only hit is prose inside a marketing example on the Grain integration page. No
  operation in any of the seven published OpenAPI documents declares a 429 response, none declares a
  Retry-After or X-RateLimit header, and the pricing page attaches no call quota to either tier.
notes: >-
  What CustomerOS does publish are SENDING throttles inside the Flow API, and they must not be
  mistaken for API rate limits — they govern how fast the product sends email on the customer's
  behalf, not how fast a client may call the API. They are recorded separately below.
sources:
- https://docs.customeros.ai
- https://customeros.ai/pricing
- openapi/customeros-flow-api-openapi.yml
responseCodes:
  throttled: null
  note: No 429 is declared in any published spec.
headers:
  published: []
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented or declared anywhere. An agent
    has no runtime signal to back off on; it can only infer from 5xx.
limits: []
product_sending_throttles:
  note: >-
    NOT API rate limits. Customer-configurable sending controls on a flow schedule.
  source: openapi/customeros-flow-api-openapi.yml
  fields:
  - {name: limits.emailsPerMailboxPerHour, type: integer, scope: mailbox, window: hour}
  - {name: limits.emailsPerMailboxPerDay, type: integer, scope: mailbox, window: day}
  - {name: rules.minutesDelayBetweenEmails, type: integer, scope: flow}
  - {name: dailySendLimit, type: integer, scope: sender, source: SenderCreate}
policies:
- name: Per-Request Access
  description: >-
    API endpoint groups are enabled per customer on request by the CustomerOS team, which functions
    as the de facto access control in place of a published quota.
- name: Backoff Strategy
  description: >-
    Client-side only. With no 429 and no Retry-After, clients should apply exponential backoff with
    jitter on 5xx and treat 4xx as terminal.
