description: >-
  CustomerOS runs a live, anonymous, remote MCP server on its documentation host. It is a
  DOCUMENTATION server (search + a read-only virtual filesystem over the docs pages and the
  published OpenAPI), not a server over the CustomerOS product API — none of its three tools
  create, read or mutate CustomerOS data. It is nevertheless a real, reachable agent surface:
  tools/list returned HTTP 200 anonymously with full JSON Schema input contracts.
