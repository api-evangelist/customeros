description: >-
  CustomerOS publishes no client SDK for its own REST or GraphQL API in any language. What it does
  publish are two installable Go tools (mailsherpa, mailwatcher) and two npm packages left over from
  the Openline era. Nothing here wraps the CustomerOS API, so `official: true` is recorded where the
  publisher is first-party, but `api_client: false` is recorded on every entry — the distinction
  matters, because a first-party package is not the same thing as a first-party API client.
