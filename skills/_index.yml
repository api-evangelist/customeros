- Resolve api.customeros.ai before blaming a credential — it has no A record as of 2026-08-13.
- Authenticate with the X-CUSTOMER-OS-API-KEY header; keys are issued per request by CustomerOS.
- No idempotency key exists anywhere; HTTP 409 is the only duplicate suppression.
- Errors are a flat {status, message, requestId} JSON envelope, not RFC 9457, with no error codes.
- Bulk operations return 206/207 — a 2xx is not proof the whole batch landed.
