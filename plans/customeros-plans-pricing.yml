description: >-
  CustomerOS publishes a real, itemized price on customeros.ai/pricing: one named tier, Growth, at
  $2,999 per month on a twelve-month commitment, with unlimited seats, plus an Enterprise tier at a
  custom price. Both are subscriptions to the product; NEITHER is an API plan. There is no API price,
  no metered call price, and no self-serve API key — access to each API endpoint group is granted by
  the CustomerOS team on request. A 30-day money-back guarantee is advertised across both tiers.
notes: >-
  This supersedes the 2026-06-20 record, which described an "Open Source (Self-Hosted)" free tier and
  a contact-sales cloud. That framing is no longer accurate: the openline-ai GitHub organization has
  been deleted, the repository now lives at github.com/customeros/customeros under a NOASSERTION
  license, and self-hosting is no longer presented as a product option anywhere on the site. The
  pricing page now names a price.
